<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="100%" height="100%">
  <defs>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Housing of Horizontal Traffic Light -->
  <rect x="10" y="24" width="120" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="3" filter="url(#lightGlow)"/>
  
  <!-- Red Light (Alerta / Crítico) -->
  <circle cx="35" cy="50" r="18" fill="#450a0a" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="35" cy="50" r="14" fill="#ef4444"/>
  <circle cx="31" cy="46" r="3.5" fill="#ffffff" opacity="0.6"/>
  <text x="35" y="88" font-size="8.5" font-family="sans-serif" font-weight="800" fill="#dc2626" text-anchor="middle">ROJO</text>
  
  <!-- Yellow Light (Observación / Leve) -->
  <circle cx="70" cy="50" r="18" fill="#451a03" stroke="#78350f" stroke-width="2"/>
  <circle cx="70" cy="50" r="14" fill="#eab308"/>
  <circle cx="66" cy="46" r="3.5" fill="#ffffff" opacity="0.6"/>
  <text x="70" y="88" font-size="8.5" font-family="sans-serif" font-weight="800" fill="#ca8a04" text-anchor="middle">AMARILLO</text>
  
  <!-- Green Light (Normal / Estable) -->
  <circle cx="105" cy="50" r="18" fill="#064e3b" stroke="#065f46" stroke-width="2"/>
  <circle cx="105" cy="50" r="14" fill="#22c55e"/>
  <circle cx="101" cy="46" r="3.5" fill="#ffffff" opacity="0.6"/>
  <text x="105" y="88" font-size="8.5" font-family="sans-serif" font-weight="800" fill="#16a34a" text-anchor="middle">VERDE</text>
  
  <!-- Medical cross badge on traffic light -->
  <rect x="67" y="10" width="6" height="14" fill="#0d9488" rx="2"/>
  <rect x="63" y="14" width="14" height="6" fill="#0d9488" rx="2"/>
</svg>
