<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lungLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lungRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="42" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Trachea (Windpipe) -->
  <path d="M50 14 L50 42" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
  <!-- Tracheal rings -->
  <line x1="47" y1="20" x2="53" y2="20" stroke="#bae6fd" stroke-width="2"/>
  <line x1="47" y1="26" x2="53" y2="26" stroke="#bae6fd" stroke-width="2"/>
  <line x1="47" y1="32" x2="53" y2="32" stroke="#bae6fd" stroke-width="2"/>
  <!-- Bronchi bifurcation -->
  <path d="M50 40 L38 52" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M50 40 L62 52" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left Lung Lobe -->
  <path d="M38 46 C22 46 16 60 18 74 C20 84 32 86 42 80 C46 76 45 54 38 46 Z" fill="url(#lungLeft)"/>
  <!-- Right Lung Lobe -->
  <path d="M62 46 C78 46 84 60 82 74 C80 84 68 86 58 80 C54 76 55 54 62 46 Z" fill="url(#lungRight)"/>
  <!-- Airflow ripples (respiratory cycles) -->
  <path d="M14 36 C18 34 22 38 26 36" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M86 36 C82 34 78 38 74 36" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 44 C18 42 22 46 28 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 44 C82 42 78 46 72 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
