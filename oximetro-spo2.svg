<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="oxiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="42" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <!-- Finger Clip Body -->
  <rect x="20" y="24" width="60" height="52" rx="10" fill="url(#oxiGrad)" stroke="#115e59" stroke-width="2"/>
  <!-- Oximeter Clip Hinge -->
  <rect x="16" y="44" width="8" height="12" rx="3" fill="#042f2e"/>
  <!-- OLED Digital Screen -->
  <rect x="28" y="32" width="44" height="34" rx="5" fill="url(#screenGrad)" stroke="#134e4a" stroke-width="1.5"/>
  <!-- SpO2 label -->
  <text x="32" y="42" font-size="6.5" font-family="monospace" font-weight="bold" fill="#5eead4">%SpO₂</text>
  <!-- Numeric 98% reading -->
  <text x="50" y="56" font-size="14" font-family="sans-serif" font-weight="900" fill="#34d399">98</text>
  <!-- Pleth Waveform Curve (Photoplethysmography PPG) -->
  <path d="M30 60 Q34 57 37 62 T44 58 T51 61 T58 57 T65 62 T70 59" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <!-- Red LED Sensor Light Ray -->
  <circle cx="74" cy="50" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="74" cy="50" r="2" fill="#ffffff"/>
</svg>
