<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Background Aura -->
  <circle cx="50" cy="50" r="44" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Clipboard Board -->
  <rect x="22" y="16" width="56" height="72" rx="7" fill="url(#boardGrad)" stroke="#075985" stroke-width="2"/>
  <!-- White Note Sheet -->
  <rect x="26" y="24" width="48" height="60" rx="4" fill="url(#paperGrad)" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Metallic Clip on Top -->
  <rect x="36" y="12" width="28" height="10" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="42" y="15" width="16" height="4" rx="2" fill="#94a3b8"/>
  <!-- Written SOAPIE lines -->
  <line x1="32" y1="34" x2="68" y2="34" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="64" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="60" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="66" y2="54" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="60" x2="52" y2="60" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Checklist Checkmarks -->
  <circle cx="33" cy="70" r="3" fill="#22c55e"/>
  <polyline points="31,70 32.5,71.5 35,69" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="39" y1="70" x2="66" y2="70" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nurse Clinical Stamp -->
  <circle cx="64" cy="74" r="7" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <text x="64" y="76.5" font-size="4" font-family="sans-serif" font-weight="bold" fill="#0d9488" text-anchor="middle">SOAPIE</text>
  <!-- Ballpoint Pen -->
  <path d="M72 20 L84 32 L81 35 L69 23 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <polygon points="69,23 66,20 69,26" fill="#1e293b"/>
</svg>
