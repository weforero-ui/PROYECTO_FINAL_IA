<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="50" cy="50" r="42" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <!-- Anatomical / Stylized Heart -->
  <path d="M50 82 C22 62 14 44 22 28 C28 16 42 16 50 28 C58 16 72 16 78 28 C86 44 78 62 50 82 Z" 
        fill="url(#heartGrad)" filter="url(#heartGlow)"/>
  <!-- Highlight Curve -->
  <path d="M26 30 C30 20 40 20 46 28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Electrocardiogram Wave (ECG Sinus Rhythm) -->
  <path d="M12 52 L34 52 L38 46 L42 58 L48 34 L54 66 L58 48 L62 54 L66 52 L88 52" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pulse dots -->
  <circle cx="48" cy="34" r="3" fill="#fef08a"/>
</svg>
